<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner console · RibbonInvites</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A1C2F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.login{max-width:420px;margin:12vh auto 0;display:grid;gap:16px}
.login .card{padding:30px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.sum small{display:flex;gap:7px;align-items:center;color:var(--muted);font-weight:600;font-size:.8rem}
.sum small .i{width:15px;height:15px;color:var(--gold-2)}
.sum b{display:block;font:400 2rem/1.1 var(--display);margin-top:6px;letter-spacing:-.02em}
@media (max-width:760px){.sum{grid-template-columns:1fr 1fr}}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{display:grid;grid-template-columns:minmax(0,1.4fr) .7fr 300px 210px;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev.h{background:var(--surface-2);font:700 .72rem/1 var(--ui);letter-spacing:.08em;color:var(--muted);padding:12px 18px}
.ev b{display:block;font-weight:600}
.ev small{color:var(--muted);display:block;font-size:.82rem}
.ev .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:980px){.ev{grid-template-columns:1fr}.ev.h{display:none}.ev .acts{justify-content:flex-start}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters{display:flex;gap:6px}
.filters button{font:600 .82rem/1 var(--ui);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{position:relative}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.search .input{padding:9px 12px 9px 36px;width:240px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><img src="/favicon.svg" alt=""><span class="wm" data-wordmark>RibbonInvites</span></a>
  <span class="badge gold plain" style="margin-left:4px">Owner</span>
  <span class="spacer"></span>
  <button class="btn sm ghost" id="out" hidden><svg class="i"><use href="/img/icons.svg#logout"/></svg>Sign out</button>
</div></header>
<main class="wrap" style="padding-bottom:80px">
  <div id="login" class="login" hidden>
    <div class="card stack">
      <div><h1 class="h3" style="font-size:1.6rem">Owner sign-in</h1><p class="muted small" style="margin-top:6px">Enter the <code class="kbd">OWNER_KEY</code> you set in your Vercel environment variables.</p></div>
      <form class="stack" id="lf"><input class="input" id="key" type="password" autocomplete="current-password" placeholder="Owner key" aria-label="Owner key">
      <button class="btn primary" type="submit">Sign in</button><p class="hint" id="lerr" role="alert" style="color:var(--bad)"></p></form>
    </div>
  </div>
  <div id="main" hidden>
    <div style="padding-top:28px"><span class="eyebrow">Owner console</span><h1 class="h2" style="margin-top:10px">Invitations</h1></div>
    <div class="sum" id="sum"></div>
    <div class="toolbar">
      <div class="filters" id="filters"><button data-f="all" aria-pressed="true">All</button><button data-f="pending" aria-pressed="false">Awaiting payment</button><button data-f="active" aria-pressed="false">Active</button></div>
      <span class="spacer"></span>
      <label class="search"><svg class="i"><use href="/img/icons.svg#search"/></svg><input class="input" id="q" placeholder="Search names or reference" aria-label="Search"></label>
      <button class="btn sm" id="reload"><svg class="i"><use href="/img/icons.svg#refresh"/></svg>Refresh</button>
    </div>
    <div class="tbl" id="list"></div>
  </div>
</main>
<script src="/js/brand.js"></script>
<script src="/js/ui.js"></script>
<script>
(function () {
  const { $, $$, esc, icon, api, toast, fail, ugx, fmtDate, ago } = UI; const B = BRAND;
  UI.header(); UI.brand();
  let key = ''; try { key = sessionStorage.getItem('ownerKey') || ''; } catch {}
  let events = [], filter = 'all';
  const price = e => e.plan === 'custom' ? 0 : ((B.plans.find(p => p.id === e.plan) || {}).price || 0);
  async function load() {
    if (!key) { $('#login').hidden = false; $('#main').hidden = true; $('#out').hidden = true; return; }
    try { const r = await api(`owner/events?k=${encodeURIComponent(key)}`); events = r.events; $('#login').hidden = true; $('#main').hidden = false; $('#out').hidden = false; draw(); }
    catch (x) { $('#login').hidden = false; $('#main').hidden = true; $('#lerr').textContent = 'That key didn’t work. Check OWNER_KEY in Vercel.'; key = ''; }
  }
  function draw() {
    const act = events.filter(e => e.active);
    $('#sum').innerHTML = [['ribbon', 'Invitations', events.length], ['check-circle', 'Active', act.length], ['wallet', 'Revenue', ugx(act.reduce((s, e) => s + price(e), 0))], ['users', 'Guests managed', events.reduce((s, e) => s + e.stats.invited, 0)]]
      .map(([ic, a, b]) => `<div><small>${icon(ic)}${a}</small><b>${b}</b></div>`).join('');
    const q = $('#q').value.toLowerCase();
    const list = events.filter(e => filter === 'all' || (filter === 'active' ? e.active : !e.active)).filter(e => !q || `${e.a} ${e.b} ${e.slug}`.toLowerCase().includes(q));
    $('#list').innerHTML = `<div class="ev h"><span>INVITATION</span><span>GUESTS</span><span>PLAN</span><span></span></div>` + (list.length ? list.map(e => `<div class="ev">
      <div><b>${esc(e.a)} &amp; ${esc(e.b)}</b><small>${esc(fmtDate(e.date))} · ${esc((B.templates.find(t => t.id === e.template) || { name: e.template }).name)} · created ${ago(e.createdAt)}</small><small>Ref: ${esc(e.slug)}${e.hostPhone ? ` · Host +${esc(e.hostPhone)}` : ''}</small></div>
      <div><b>${e.stats.invited}</b><small>${e.stats.opened} opened · ${e.stats.attending} attending</small></div>
      <div class="row" style="flex-wrap:nowrap"><select class="select" data-plan="${e.slug}" aria-label="Plan">${B.plans.map(p => `<option value="${p.id}" ${p.id === e.plan ? 'selected' : ''}>${esc(p.name)} · ${p.guests} guests</option>`).join('')}<option value="custom" ${e.plan === 'custom' ? 'selected' : ''}>Custom</option></select>
        ${e.active ? '<span class="badge ok">Active</span>' : '<span class="badge warn">Preview</span>'}</div>
      <div class="acts"><button class="btn sm ${e.active ? '' : 'primary'}" data-act="${e.slug}" data-on="${e.active ? 0 : 1}">${e.active ? 'Deactivate' : icon('check') + 'Activate'}</button>
        <a class="btn sm" target="_blank" rel="noopener" href="/dashboard/${e.slug}?k=${encodeURIComponent(e.adminKey)}">${icon('external')}Open</a></div></div>`).join('')
      : `<div class="empty">${icon('ribbon')}<span>No invitations here yet.</span></div>`);
  }
  $('#list').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const slug = b.dataset.act, plan = document.querySelector(`[data-plan="${slug}"]`).value, on = b.dataset.on === '1';
    const ev = events.find(x => x.slug === slug);
    let customGuests;
    if (plan === 'custom' && on) { customGuests = prompt('How many guests for this custom plan?', '800'); if (!customGuests) return; }
    if (!await UI.confirm(on ? `Activate ${ev.a} & ${ev.b}?` : `Deactivate ${ev.a} & ${ev.b}?`, on ? 'Only activate after you have confirmed their Mobile Money payment.' : 'They will go back to the 5-guest preview limit. Existing guests keep their links.', { ok: on ? 'Activate' : 'Deactivate', danger: !on })) return;
    try { await api(`owner/activate?k=${encodeURIComponent(key)}`, { method: 'POST', body: { slug, plan, active: on, customGuests } }); toast(on ? 'Invitation activated' : 'Invitation deactivated'); load(); } catch (x) { fail(x); }
  });
  $$('#filters button').forEach(b => b.onclick = () => { filter = b.dataset.f; $$('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('#lf').onsubmit = e => { e.preventDefault(); key = $('#key').value.trim(); try { sessionStorage.setItem('ownerKey', key); } catch {} load(); };
  $('#out').onclick = () => { try { sessionStorage.removeItem('ownerKey'); } catch {} key = ''; $('#key').value = ''; $('#lerr').textContent = ''; load(); };
  $('#q').oninput = draw; $('#reload').onclick = () => load().then(() => toast('Refreshed'));
  load();
})();
</script>
</body>
</html>
